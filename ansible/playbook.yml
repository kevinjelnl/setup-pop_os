---
- name: Configure Pop!_OS workstation
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    dotfiles_home: "{{ lookup('env', 'HOME') }}"

  tasks:
    - name: Manage APT packages
      ansible.builtin.include_role:
        name: packages
      tags: packages

    - name: Install required APT packages
      ansible.builtin.apt:
        name:
          - yadm
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install Waterfox
      ansible.builtin.include_role:
        name: waterfox
      tags: waterfox

    - name: Install Proton applications
      ansible.builtin.include_role:
        name: proton
      tags: proton

    - name: Configure COSMIC
      ansible.builtin.include_role:
        name: cosmic
      tags: cosmic

    - name: Configure Alacritty
      ansible.builtin.include_role:
        name: alacritty
      tags: alacritty

    - name: Install Leaf
      ansible.builtin.include_role:
        name: leaf
      tags: leaf

    - name: Generate the SSH key
      ansible.builtin.include_role:
        name: ssh_keygen
      tags: ssh_keygen

    - name: Clone and manage dotfiles
      ansible.builtin.include_role:
        name: dotfiles
