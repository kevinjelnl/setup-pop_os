---
- name: Install configured APT packages
  ansible.builtin.apt:
    name: "{{ packages_to_install }}"
    state: "{{ 'latest' if update_binaries | bool else 'present' }}"
    update_cache: true
  when: packages_to_install | length > 0

- name: Remove configured APT packages
  ansible.builtin.apt:
    name: "{{ packages_to_remove }}"
    state: absent
    purge: true
  when: packages_to_remove | length > 0

- name: Check whether Flatpak is installed
  ansible.builtin.shell: command -v flatpak
  register: flatpak_command
  changed_when: false
  failed_when: false

- name: Check whether Thunderbird is installed as a Flatpak
  ansible.builtin.command:
    argv:
      - flatpak
      - info
      - org.mozilla.Thunderbird
  register: thunderbird_flatpak
  changed_when: false
  failed_when: false
  become: false
  when: flatpak_command.rc == 0

- name: Remove Thunderbird Flatpak
  ansible.builtin.command:
    argv:
      - flatpak
      - uninstall
      - --noninteractive
      - org.mozilla.Thunderbird
  become: false
  when:
    - flatpak_command.rc == 0
    - thunderbird_flatpak.rc == 0
